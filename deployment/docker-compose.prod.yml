version: "3.8"

services:
  # 1. MECHANICAL TRUTH
  tigerbeetle:
    image: ghcr.io/tigerbeetle/tigerbeetle:latest
    container_name: sovr_tigerbeetle
    restart: always
    ports:
      - "3000:3000"
    volumes:
      - ./tigerbeetle_data:/data
    command: start --addresses=0.0.0.0:3000 /data/0_0.tigerbeetle
    security_opt:
      - seccomp:unconfined
    cap_add:
      - IPC_LOCK

  # 2. NARRATIVE MIRROR
  postgres:
    image: postgres:15
    container_name: sovr_postgres
    restart: always
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 3. API SERVICE
  api:
    image: stavomidnite661/val-core-backend:latest
    container_name: sovr_api
    restart: always
    ports:
      - "3001:3001"
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
      - TIGERBEETLE_CLUSTER_ID=0
      - TIGERBEETLE_REPLICA_ADDRESSES=tigerbeetle:3000
      - PORT=3001
      - API_PORT=3001
    depends_on:
      postgres:
        condition: service_healthy
      tigerbeetle:
        condition: service_started
    security_opt:
      - seccomp:unconfined
    cap_add:
      - IPC_LOCK
    volumes:
      - ./server.ts:/app/val/server.ts

volumes:
  postgres_data:
